apiVersion: v1
kind: Service 
metadata: 
  name: service 
  labels: 
    project: roboshop
    env: dev

spec:
  selector:
    project: roboshop
    component: nginx

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-service
  labels:
    project: Roboshop
    component: nginx
    
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "150m"
          memory: "200Mi"

