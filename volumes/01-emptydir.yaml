apiVersion: v1
kind: Pod
metadata:
  name: nginx-emptydir
  labels:
    project: roboshop
    purpose: emptydir
spec:
  containers:
  - name: nginx-1
    image: nginx
    resources:
      requests: 
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "150Mi"
        cpu: "150m"

    volumeMounts:
    - name: storage
      mountPath: /usr/share/nginx/html
      

  - image: almalinux:9
    name: almalinux
    command: ["sleep", "1000"]
    resources:
      requests: 
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "150Mi"
        cpu: "150m"
    
    volumeMounts:
    - name: storage
      mountPath: /etc/htmlpages
    

  volumes: 
    - name: storage
      emptyDir: {}

   
