apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3-sc
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pvc-ebs
  labels:
    project: roboshop
    component: nginx
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests: 
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "150Mi"
        cpu: "150m"

    volumeMounts:
    - name: pvc-volume
      mountPath: /usr/share/nginx/html

  volumes:
    - name: pvc-volume
      persistentVolumeClaim:
        claimName: ebs-pvc

    
      
